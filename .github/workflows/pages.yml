name: Deploy Milo Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check static files
        run: |
          test -s playground/dist/index.html
          test -s playground/dist/engine/milo-engine.js
          test -s playground/dist/engine/milo-engine.wasm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
